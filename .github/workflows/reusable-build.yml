name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash  # also on Windows (Git Bash), so that the commands are the same on all the systems
    env:
      VENV_BIN: ${{ startsWith(inputs.os, 'windows') && 'Scripts' || 'bin' }}  # the directory of the executables of a virtual environment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: oldest
        with:
          python-version: "3.10"  # the oldest version of Python supported by PyCSP3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"  # the newest version of Python, the one of the commands python and pip below

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the package
        run: |
          pip install build
          python -m build

      - name: Install the package in a new environment, with the oldest and the newest versions of Python
        env:
          PYTHON_OLDEST: ${{ steps.oldest.outputs.python-path }}
        run: |
          "$PYTHON_OLDEST" -m venv "$RUNNER_TEMP/venv-oldest"
          python -m venv "$RUNNER_TEMP/venv-newest"
          for venv in venv-oldest venv-newest; do "$RUNNER_TEMP/$venv/$VENV_BIN/pip" install dist/*.whl; done

      - name: Solve a model with the installed package, with the oldest and the newest versions of Python
        working-directory: ${{ runner.temp }}
        run: |
          printf 'from pycsp3 import *\n\nx = VarArray(size=3, dom=range(3))\n\nsatisfy(\n    AllDifferent(x)\n)\n\nassert solve() is SAT, status()\nprint(values(x))\n' > model.py
          for venv in venv-oldest venv-newest; do
            "$RUNNER_TEMP/$venv/$VENV_BIN/python" --version
            "$RUNNER_TEMP/$venv/$VENV_BIN/python" model.py
          done
