name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash  # also on Windows (Git Bash), so that the commands are the same on all the systems
    env:
      VENV_BIN: ${{ startsWith(inputs.os, 'windows') && 'Scripts' || 'bin' }}  # the directory of the executables of a virtual environment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build the package
        run: |
          pip install build
          python -m build

      - name: Install the package in a new environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/$VENV_BIN/pip" install dist/*.whl

      - name: Solve a model with the installed package
        working-directory: ${{ runner.temp }}
        run: |
          printf 'from pycsp3 import *\n\nx = VarArray(size=3, dom=range(3))\n\nsatisfy(\n    AllDifferent(x)\n)\n\nassert solve() is SAT, status()\nprint(values(x))\n' > model.py
          "$RUNNER_TEMP/venv/$VENV_BIN/python" model.py
