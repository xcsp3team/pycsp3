name: Build Windows

# the package is built at each push on master (so when a pull request is merged) and when a tag is pushed, not for each commit of a
# pull request; it can also be built on a pull request by adding the label run-tests to it (with the tests), and on demand from the
# tab Actions (workflow_dispatch)
on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-tests'
    uses: ./.github/workflows/reusable-build.yml
    with:
      os: windows-latest
