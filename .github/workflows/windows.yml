name: Windows

# the package is built, then tested if the build succeeds, at each push on master (so when a pull request is merged), not for each
# commit of a pull request; this can also be done on a pull request by adding the label run-tests to it, and on demand from the tab
# Actions (workflow_dispatch); the publication of a version (with its tag) is made by release.yml
on:
  push:
    branches: [master]
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-tests'
    uses: ./.github/workflows/reusable-build.yml
    with:
      os: windows-latest

  tests:
    needs: build
    uses: ./.github/workflows/reusable-tests.yml
    with:
      os: windows-latest
