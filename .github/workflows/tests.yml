name: Unit tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the dependencies
        run: pip install lxml "cosoco>=2.6.1" pytest pytest-xdist pytest-timeout

      - name: Run the unit tests
        run: python -m pytest pycsp3/tests -n auto

      - name: Keep the files of the tests (models, XCSP3 files, solver logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: files-of-the-tests
          path: pycsp3/tests/output/
