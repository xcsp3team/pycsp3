name: Linux

# the package is built, then tested if the build succeeds, at each push on master (so when a pull request is merged) and when a tag
# is pushed, not for each commit of a pull request; this can also be done on a pull request by adding the label run-tests to it, and
# on demand from the tab Actions (workflow_dispatch)
on:
  push:
    branches: [master]
    tags: ['**']
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-tests'
    uses: ./.github/workflows/reusable-build.yml
    with:
      os: ubuntu-latest

  tests:
    needs: build
    uses: ./.github/workflows/reusable-tests.yml
    with:
      os: ubuntu-latest
